name: llm-proxy

services:
  proxy:
    build: .
    image: llm-proxy:1.0
    container_name: llm-proxy
    restart: unless-stopped

    # Host networking, so LLM_HOSTNAME can name an Open WebUI published on the
    # host's loopback. A bridged container cannot reach 127.0.0.1:3000 --
    # host.docker.internal resolves to the bridge gateway and times out against
    # a loopback-bound port. With host networking the proxy binds LISTEN_HOST
    # itself, so `ports:` does not apply.
    network_mode: host

    environment:
      # The only thing this service needs to know. Accepts a bare host, a
      # host:port, or a full URL with a base path:
      #   webui.example.com | webui.example.com:3000
      #   http://127.0.0.1:3000 | https://ai.example.com/openwebui/
      LLM_HOSTNAME: ${LLM_HOSTNAME:?set LLM_HOSTNAME in .env}

      # Loopback only. Set 0.0.0.0 to expose the endpoint on the network, which
      # also exposes whatever the pinned token can reach.
      LISTEN_HOST: ${LISTEN_HOST:-127.0.0.1}
      LISTEN_PORT: ${LISTEN_PORT:-8111}

      # An Open WebUI token used when the caller sends none.
      WEBUI_TOKEN: ${WEBUI_TOKEN:-}

      # true = a caller must present its own bearer token even when WEBUI_TOKEN
      # is set; the pinned token is then only the upstream credential.
      REQUIRE_CLIENT_TOKEN: ${REQUIRE_CLIENT_TOKEN:-false}

    healthcheck:
      test: ["CMD", "python", "-c",
             "import os,urllib.request;urllib.request.urlopen('http://127.0.0.1:%s/health' % os.environ.get('LISTEN_PORT','8111'),timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
